[project]
name = "multimodal-detector"
version = "2.13.0"
description = "A multimodal human-computer interaction system for drone swarm control"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Claude Code", email = "noreply@anthropic.com"}
]
keywords = ["multimodal", "gesture", "voice", "detection", "drone", "swarm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]

dependencies = [
    "PySide6>=6.5.0",
    "opencv-python>=4.8.0,<5",
    "numpy>=1.24.0,<2",
    "mediapipe==0.10.9",
    # SenseVoice-Small is the default ASR engine.  FunASR is an optional
    # extra because it downloads a substantially larger model/runtime.
    "sherpa-onnx>=1.10.0",
    "ultralytics>=8.0.0",
    "pyqtgraph>=0.13.0",
    "PyOpenGL>=3.1.0",
    "PyOpenGL_accelerate>=3.1.0",
    "scipy>=1.10.0",
    "Pillow>=9.0.0",
    "PyYAML>=6.0",
    "sounddevice>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-qt>=4.2.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
funasr = [
    "funasr>=1.0.0",
]
ros = [
    "rospy",
    "std_msgs",
    "geometry_msgs",
    "visualization_msgs",
]

[project.scripts]
multimodal-detector = "main:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["assets*", "config*", "detectors*", "ui*", "utils*", "workers*", "ros_bridge*"]

[tool.setuptools.package-data]
assets = [
    "models/**/*.obj",
    "models/**/*.json",
    "models/**/*.md",
    "models/**/*.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ["py310"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | __pycache__
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip = [".git", ".venv", "__pycache__", "build", "dist"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["config", "detectors", "ui", "utils", "workers", "ros_bridge"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
