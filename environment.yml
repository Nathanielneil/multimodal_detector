# Conda bootstrap environment for Ubuntu 22.04 + NVIDIA GPU.
#
# PyTorch is intentionally installed after this environment is created. That
# lets each machine select a wheel compatible with its GPU generation. RTX 50
# series hosts should use the cu128 command in docs/UBUNTU22_DEPLOY.md.
# For CPU-only hosts use environment-ubuntu22-cpu.yml.
# Usage: conda env create -f environment.yml
#        conda activate multimodal
name: multimodal
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
